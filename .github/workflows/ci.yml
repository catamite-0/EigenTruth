name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            dependency-set: minimum
            torch-spec: "torch==2.0.*"
          - python-version: "3.10"
            dependency-set: latest
            torch-spec: torch
          - python-version: "3.11"
            dependency-set: latest
            torch-spec: torch
          - python-version: "3.12"
            dependency-set: latest
            torch-spec: torch
          - python-version: "3.13"
            dependency-set: latest
            torch-spec: torch

    name: Python ${{ matrix.python-version }} (${{ matrix.dependency-set }})

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.torch-spec }}" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Lint with ruff
        run: python -m ruff check src tests examples benchmarks

      - name: Run tests
        run: python -m pytest tests/ -v --cov=eigentruth --cov-report=term-missing

      - name: Run profile gate smoke
        run: python benchmarks/profile_gate_smoke.py

      - name: Build package
        run: python -m build
