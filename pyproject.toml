[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eigentruth"
version = "0.2.0"
description = "Alpha research-preview PyTorch toolkit for calibrated LLM observability, representation diagnostics, verifier/control traces, and optional activation steering / 面向大模型校准观测、表征诊断、验证/控制轨迹与可选激活引导的 PyTorch 研究预览工具库"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "EigenTruth Team"},
]
keywords = ["llm", "hallucination", "pytorch", "representation-engineering", "geometric-dynamics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
eval = [
    "datasets>=2.14,<5",
]
hf = [
    "transformers>=4.35,<6",
]
examples = [
    "accelerate>=0.25",
    "safetensors>=0.4",
    "sentencepiece>=0.1.99",
    "transformers>=4.35,<6",
]

[project.urls]
Homepage = "https://github.com/catamite-0/EigenTruth"
Repository = "https://github.com/catamite-0/EigenTruth"
Issues = "https://github.com/catamite-0/EigenTruth/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "artifact: checks tracked release/baseline artifacts and manifests",
    "workflow: exercises no-model benchmark workflow plumbing",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.pycodestyle]
# 双语注释/文档字符串不可避免地较长
# Bilingual comments/docstrings are inevitably longer
max-doc-length = 150
